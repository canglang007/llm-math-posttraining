# E1 pilot v2：修掉两处已诊断的缺陷后重跑，目标是把 E1 从「退化不可用」变成「可评测」。
#
# 与 pilot（v1）的差异，只有两处，都是 issue-log 里已定位的根因：
#   1. force_chat_template: true
#      Qwen3-4B-Base 自带 chat_template 会在 assistant 目标前注入空的
#      <think>\n\n</think>\n\n，而评测侧 apply_chat_template 不注入，
#      训练/推理 prompt 分布不一致 → 模型学成「先吐空 think 块」。
#      强制用 QWEN_CHATML_TEMPLATE，训练与推理同构。
#   2. max_steps 200 -> 400
#      v1 的 200 步 = 3200 样本 = 0.46 epoch，loss 0.490 仍在下降，
#      三层诊断结论是「欠拟合」而非「训坏」。400 步约 0.92 epoch。
#
# 其余超参一律不动，以保证与 v1 的失败可以逐项对照（实验记录要讲清的是
# 「同一个配置只改两个变量，结果从不可用到可用」）。
model:
  path: /data/models/Qwen3-4B-Base
  load_in_4bit: true
  compute_dtype: bfloat16
  max_seq_len: 1024
  force_chat_template: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: experiments/sft/qwen3-4b-gsm8k-pilot-v2
  train_file: data/processed/sft/gsm8k-train.jsonl
  # pilot 不挂 dev：Trainer 的 epoch 末 eval 在 12GB 上会 OOM（见 issue-log）。
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  num_train_epochs: 2
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 42
  max_steps: 400
