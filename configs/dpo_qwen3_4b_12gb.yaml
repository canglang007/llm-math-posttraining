# E3 DPO：在 SFT/RFT adapter 上做偏好优化。
#
# 偏好数据不是人工标注，而是「同题候选里正确答案 vs 错误答案」自动配对，
# 正确性由公开答案判定（见 src/math_posttrain/preferences.py）。
# beta 取 0.1 是 TRL 默认起点；12GB 卡上 ref_model=None（复用关掉 adapter 的同一份模型）。
task: dpo
model:
  path: /data/models/Qwen3-4B-Base
  # DPO 的起点：先 RFT adapter，跑通后再对比「从 SFT 直接 DPO」。
  base_adapter: experiments/rft/qwen3-4b-gsm8k-rft
  load_in_4bit: true
  compute_dtype: bfloat16
  max_seq_len: 1024
  max_prompt_len: 512
  force_chat_template: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: experiments/dpo/qwen3-4b-gsm8k-dpo
  preference_file: data/processed/dpo/gsm8k-train-dpo.jsonl
  beta: 0.1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  num_train_epochs: 1
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 42
