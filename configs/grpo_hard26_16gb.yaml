# E4b GRPO（难度筛选版）：只用「模型有对有错」的题训练。
#
# 动机（实测数据，120 题 × k=4，SFT checkpoint-400）：
#   4/4 全对 88 题 (73%)、3/4 11 题、2/4 12 题、1/4 3 题、0/4 6 题。
#   全对/全错的题在 GRPO 里组内优势恒为 0，不产生梯度 —— 这正是全量版
#   `frac_reward_zero_std ≈ 0.67` 的成因。
#
# 对照关系：
#   E4  全量 120 题（73% 的题无梯度） vs  E4b 26 道有区分度的题（题题有梯度）
#   两者的差 = 「题目难度与模型能力匹配度」对 RL 效果的单独贡献。
#
# 数据来源：scripts/build_hard_subset.py 从同一批采样产物筛出，非人工挑选。
task: grpo
model:
  path: /data/models/Qwen3-4B-Base
  base_adapter: experiments/sft/qwen3-4b-gsm8k-sft-v3/checkpoint-400
  load_in_4bit: true
  compute_dtype: bfloat16
  max_seq_len: 1024
  force_chat_template: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: experiments/grpo/qwen3-4b-gsm8k-grpo-hard26
  dataset: gsm8k
  prompt_file: data/processed/sft/gsm8k-train-hard26.raw.jsonl
  num_prompts: 26
  num_generations: 4
  max_completion_length: 384
  temperature: 0.9
  beta: 0.0
  scale_rewards: group
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  num_train_epochs: 1
  max_steps: 16
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  logging_steps: 2
  save_strategy: steps
  save_steps: 8
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 42
